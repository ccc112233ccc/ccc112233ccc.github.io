    <rect x="120" y="615" width="240" height="126" rx="20"/>
    <rect x="1440" y="390" width="240" height="126" rx="20"/>
    <rect x="1440" y="615" width="240" height="126" rx="20"/>
  </g>
  <g fill="#62d9ff" opacity=".9">
