<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="942" viewBox="0 0 1800 942" role="img" aria-labelledby="title desc">
  <title id="title">RoCE backend network for distributed AI training</title>
  <desc id="desc">GPU nodes send high-bandwidth collective traffic through a dedicated Ethernet Clos fabric, with a highlighted congestion hotspot and receiver-driven admission.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1225"/>
      <stop offset="1" stop-color="#132c45"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62d9ff"/>
      <stop offset="1" stop-color="#59f0bb"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1800" height="942" fill="url(#bg)"/>
  <circle cx="1450" cy="120" r="330" fill="#143b54" opacity=".45"/>
  <circle cx="240" cy="850" r="360" fill="#102f4c" opacity=".55"/>

  <g font-family="Inter,Arial,sans-serif">
    <text x="110" y="130" fill="#8ba5bd" font-size="30" letter-spacing="8">AI TRAINING BACKEND</text>
    <text x="110" y="205" fill="#f3f8fc" font-size="62" font-weight="700">RoCE at Meta Scale</text>
    <text x="110" y="258" fill="#9db5c8" font-size="28">Low entropy · Bursty collectives · 400G elephant flows</text>
  </g>

  <g stroke="#78a2bb" stroke-width="3" fill="#172d43">
