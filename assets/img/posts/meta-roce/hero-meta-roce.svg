    <rect x="150" y="645" width="54" height="54" rx="8"/><rect x="217" y="645" width="54" height="54" rx="8"/><rect x="284" y="645" width="46" height="54" rx="8"/>
    <rect x="1470" y="420" width="54" height="54" rx="8"/><rect x="1537" y="420" width="54" height="54" rx="8"/><rect x="1604" y="420" width="46" height="54" rx="8"/>
    <rect x="1470" y="645" width="54" height="54" rx="8"/><rect x="1537" y="645" width="54" height="54" rx="8"/><rect x="1604" y="645" width="46" height="54" rx="8"/>
  </g>
  <g fill="#dceaf3" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600">
    <text x="160" y="503">GPU NODE</text><text x="160" y="728">GPU NODE</text>
    <text x="1480" y="503">GPU NODE</text><text x="1480" y="728">GPU NODE</text>
  </g>

  <g fill="#1a4560" stroke="#73d8f5" stroke-width="3">
