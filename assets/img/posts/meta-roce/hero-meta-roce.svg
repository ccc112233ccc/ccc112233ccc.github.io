  <g font-family="Inter,Arial,sans-serif" font-size="25">
    <text x="738" y="344" fill="#f6b85c">HASH COLLISION</text>
    <text x="746" y="812" fill="#8ba5bd">Dedicated Ethernet fabric · workload-aware routing · receiver-driven admission</text>
